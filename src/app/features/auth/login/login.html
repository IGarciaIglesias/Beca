<h2 class="login-title">Login</h2><br>

<form class="login-form" [formGroup]="form" (ngSubmit)="submit()">

  <div class="form-group">
    <label>Correo</label>
    <input formControlName="correo" />
  </div>
  
  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <button type="submit" class="login-button">
    Entrar
  </button>
</form>
