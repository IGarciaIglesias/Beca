<h2 class="welcome-title">¿Qué quieres gestionar?</h2>

<div class="menu-grid">

  <!-- STUDENTS -->
  <div class="menu-card" (click)="go('/students')">
    <h3>Estudiantes</h3>
    <p>Gestionar alumnos</p>
  </div>

  <!-- PROFESORES -->
  <div class="menu-card" (click)="go('/profesores')">
    <h3>Profesores</h3>
    <p>Gestionar profesores</p>
  </div>

  <!-- USERS (solo ADMIN) -->
  <div
    class="menu-card"
    *ngIf="auth.hasRole('ADMIN')"
    (click)="go('/users')"
  >
    <h3>Usuarios</h3>
    <p>Gestionar usuarios del sistema</p>
  </div>

  <!-- STATISTICS -->
  <div class="menu-card" (click)="go('/statistics')">
    <h3>Estadísticas</h3>
    <p>Ver estadísticas generales</p>
  </div>

</div>
