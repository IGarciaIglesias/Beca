<header
  style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #e5e7eb;
    background: #f9fafb;
  "
>
    <button class="home-button" (click)="inicio()">
      Students App
    </button>

  <div style="display: flex; gap: 12px; align-items: center;">
    <!-- Usuario logueado -->
    <span *ngIf="auth.user as user">
      {{ user.correo }} ({{ user.role }})
    </span>

    <!-- Botón logout -->
    <button *ngIf="auth.isLoggedIn()" (click)="auth.logout()">
      Cerrar sesión
    </button>
  </div>
</header>

<main style="padding: 16px;">
  <router-outlet></router-outlet>
</main>
